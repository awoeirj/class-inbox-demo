name: Windows bundled runtime
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test bundled executable with Node removed from server PATH
        run: node scripts/smoke.mjs plugins/class-inbox-demo-windows
